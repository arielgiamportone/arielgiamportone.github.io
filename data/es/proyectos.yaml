    de identificadores una vez y cada sede acuña sin conexión. Registro de emisión con identidades reservadas bajo centinela,
    ciclo de vida de la etiqueta (emitida, impresa, colocada, baja), resolución de cualquier código leído y detección de etiqueta
    cruzada, hojas A4 adhesivas en PDF vectorial (tres presets) y etiqueta individual, ZPL para impresoras-codificadoras RFID.
    Segundo caso de estudio clean-room: implementado desde la spec sin acceso a la fuente y revisado contra ella (1 bloque

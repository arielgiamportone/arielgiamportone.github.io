- id: asset_identity_gs1
  nombre: asset-identity-gs1
  organizacion: Personal · patterns developed at Intervalor Data, published with permission
  tipo: software_open_source
  rol: Autor (especificación, implementación clean-room y revisión)
  fechas: 11/2026
  estado: Público desde 2026-11-17 · release v0.1.0 · PyPI asset-identity-gs1 0.1.0 · MIT · CI verde (Python 3.11 y 3.12)
  descripcion: 'Physical identity for inventory assets with GS1 standards: each asset gets one identity in four equivalent
    forms (canonical GIAI AI 8004, a readable alias with a mod-43 check character for Code128, EPC GIAI-96 for UHF RFID and
    GS1 Digital Link for QR). Global multi-tenant uniqueness by construction: an authority hands out blocks of the identifier
    space once and each site mints offline. Issuance register, label life cycle, resolution of any scanned code, vector PDF
    label sheets and ZPL for RFID printer-encoders. A clean-room case study implemented from a specification without access
    to the source.'
  metricas:
  - 148 tests
  - 31 decisiones de diseño documentadas + 2 correcciones de la fase 3
  - README bilingüe en formato caso de estudio

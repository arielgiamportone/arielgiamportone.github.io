  descripcion: 'Physical identity for inventory assets with GS1 standards: each asset gets one identity in four equivalent
    forms (canonical GIAI AI 8004, a readable alias with a mod-43 check character for Code128, EPC GIAI-96 for UHF RFID and
    GS1 Digital Link for QR). Global multi-tenant uniqueness by construction: an authority hands out blocks of the identifier
    space once and each site mints offline. Issuance register, label lifecycle, resolution of any scanned code, vector PDF
    label sheets and ZPL for RFID printer-encoders. A clean-room case study implemented from a specification without access
    to the source.'

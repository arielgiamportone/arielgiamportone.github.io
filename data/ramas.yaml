# Cabecera de la portada: la carrera como un historial de git (layouts/partials/ramas.html + assets/js/ramas.js).
# Fechas y hitos tomados de la base (experiencia, formación, publicaciones y proyectos). Lista curada a mano
# para que cada rama muestre una evolución continua: al menos un hito cada 1-3 años y los años con muchos
# resultados agrupados en un solo commit. Añadir un commit es añadir una entrada aquí.
#   anio: año decimal (2015.4 ≈ mayo de 2015) · rama: main o un perfil · hito: con rótulo en la consola y en móvil
#   proyecto: id de data/<lang>/proyectos.yaml; si tiene ficha, el commit enlaza a ella
ramas:   # rama, año en que nace, rama de la que sale
  - { id: academia, nace: 2008.2, origen: main }
  - { id: economia-azul, nace: 2007.0, origen: main }
  - { id: software, nace: 2010.45, origen: main }
  - { id: sector-publico, nace: 2012.6, origen: economia-azul }
  - { id: ia, nace: 2017.5, origen: economia-azul }
merges:  # cruces entre perfiles: año, desde, hacia
  - { anio: 2019.3, desde: economia-azul, hacia: academia }
  - { anio: 2026.65, desde: ia, hacia: academia }

baseURL = "https://arielgiamportone.github.io/"
title = "Ariel Luján Giamportone"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    weight = 1
    [languages.es.params]
      description = "Datos, IA y Producto en Intervalor Data. Ingeniero Pesquero (UTN). Software con IA, datos para el sector público y economía azul."
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    [languages.en.params]
      description = "Data, AI & Product at Intervalor Data. Fisheries Engineer (UTN). AI-powered software, public-sector data and the blue economy."

[params]
  autor = "Ariel Luján Giamportone"
  # Lente por defecto en la portada (vacío = vista general)
  lenteDefecto = ""

[markup.goldmark.renderer]
  unsafe = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[sitemap]
  changeFreq = "monthly"

# CV imprimible por perfil: /perfiles/<lente>/cv.html (los PDF se generan con scripts/cv_pdf.mjs)
[outputFormats.cv]
  mediaType = "text/html"
  baseName = "cv"
  isHTML = true
  permalinkable = false
  noUgly = false

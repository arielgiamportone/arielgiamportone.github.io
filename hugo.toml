  # About Section
  [params.about]
    enable = true
    title = "Sobre mí"
    image = "/hero.png"
    content = """
Ingeniero Pesquero (UTN) que trabaja en datos, IA y producto. En Intervalor Data lidero AYUNDATA,
una plataforma de gestión patrimonial para ayuntamientos, y construyo productos de datos de punta a punta:
arquitectura, backend en Python, interfaces, IA aplicada, despliegue y cumplimiento (ENS, RGPD).

Vengo de la I+D+i en CONICET-CADIC (2012-2021) (acuicultura, oceanografía y artes de pesca, con campañas en
Patagonia y la Antártida), de la gestión pública de ciencia y tecnología en Tierra del Fuego y de la docencia
universitaria. Publico mi software como paquetes abiertos (PyPI, Zenodo) y coordino la comunidad Pesqueros en IA.

Vivo en España (Talavera de la Reina), con ciudadanía de la UE. Trabajo en remoto o desde Madrid.
"""


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t"><title id="t">Architecture of the multi-tenant asset register</title>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --box: #ffffff; --boxline: #b9c8d8; --accent: #2563eb; --accent2: #059669; --soft: #eef4fb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6edf3; --muted: #9fb0c0; --box: #18212b; --boxline: #3a4b5d; --accent: #60a5fa; --accent2: #34d399; --soft: #13202e; }
  }
  text { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
  .boxa { fill: var(--box); stroke: var(--accent); stroke-width: 2.2; }
  .boxv { fill: var(--box); stroke: var(--accent2); stroke-width: 2.2; }
  .zona { fill: var(--soft); stroke: none; }
  .arrow { stroke: var(--muted); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker></defs>
<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">Architecture of the multi-tenant asset register</text>
<rect x="30" y="70" width="260" height="140" rx="12" class="box"/><text x="160.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Legacy sources</text><text x="160.0" y="118" font-size="13" text-anchor="middle" class="muted">spreadsheets · Access</text><text x="160.0" y="137" font-size="13" text-anchor="middle" class="muted">legacy application files</text><text x="160.0" y="156" font-size="13" text-anchor="middle" class="muted">scanned deeds (OCR + local LLM)</text><text x="160.0" y="175" font-size="13" text-anchor="middle" class="muted">cadastre and street maps (REST)</text>
<rect x="30" y="250" width="260" height="90" rx="12" class="box"/><text x="160.0" y="276" font-size="16" font-weight="700" text-anchor="middle">ETL</text><text x="160.0" y="298" font-size="13" text-anchor="middle" class="muted">~20 extractors</text><text x="160.0" y="317" font-size="13" text-anchor="middle" class="muted">normalise · dedup · validate</text>
<rect x="330" y="60" width="300" height="410" rx="16" class="zona"/>
<rect x="350" y="75" width="260" height="90" rx="12" class="boxa"/><text x="480.0" y="101" font-size="16" font-weight="700" text-anchor="middle">SQL dialect layer</text><text x="480.0" y="123" font-size="13" text-anchor="middle" class="muted">the same ~1,200 statements</text><text x="480.0" y="142" font-size="13" text-anchor="middle" class="muted">on SQLite or PostgreSQL</text>
<rect x="350" y="205" width="260" height="90" rx="12" class="box"/><text x="480.0" y="231" font-size="16" font-weight="700" text-anchor="middle">One SQLite file</text><text x="480.0" y="253" font-size="13" text-anchor="middle" class="muted">on-premise install</text><text x="480.0" y="272" font-size="13" text-anchor="middle" class="muted">(Windows executable)</text>
<rect x="350" y="330" width="260" height="90" rx="12" class="box"/><text x="480.0" y="356" font-size="16" font-weight="700" text-anchor="middle">PostgreSQL</text><text x="480.0" y="378" font-size="13" text-anchor="middle" class="muted">one schema per tenant</text><text x="480.0" y="397" font-size="13" text-anchor="middle" class="muted">~35 tenants on one server</text>
<rect x="680" y="75" width="240" height="100" rx="12" class="boxv"/><text x="800.0" y="101" font-size="16" font-weight="700" text-anchor="middle">Valuation engine</text><text x="800.0" y="123" font-size="13" text-anchor="middle" class="muted">depreciation · revaluation</text><text x="800.0" y="142" font-size="13" text-anchor="middle" class="muted">calculation memo per figure</text>
<rect x="680" y="215" width="240" height="100" rx="12" class="box"/><text x="800.0" y="241" font-size="16" font-weight="700" text-anchor="middle">FastAPI back office</text><text x="800.0" y="263" font-size="13" text-anchor="middle" class="muted">per-section permissions · CSRF</text><text x="800.0" y="282" font-size="13" text-anchor="middle" class="muted">per-tenant feature flags</text>
<rect x="680" y="355" width="240" height="100" rx="12" class="box"/><text x="800.0" y="381" font-size="16" font-weight="700" text-anchor="middle">Outputs</text><text x="800.0" y="403" font-size="13" text-anchor="middle" class="muted">Word and Excel reports · labels</text><text x="800.0" y="422" font-size="13" text-anchor="middle" class="muted">static transparency portal</text>
<rect x="950" y="185" width="220" height="140" rx="12" class="boxv"/>
<text x="1060" y="214" font-size="15" font-weight="700" text-anchor="middle">Reconciliation with the</text>
<text x="1060" y="234" font-size="15" font-weight="700" text-anchor="middle">legacy closing</text>
<text x="1060" y="264" font-size="13" text-anchor="middle" class="muted">per account, to the cent,</text>
<text x="1060" y="283" font-size="13" text-anchor="middle" class="muted">before a tenant opens</text>
<path d="M160 210 L160 248" class="arrow"/>
<path d="M290 295 L348 120" class="arrow"/>
<path d="M480 165 L480 203" class="arrow"/>
<path d="M365 165 C338 230 338 330 348 368" class="arrow"/>
<path d="M610 120 L678 125" class="arrow"/>
<path d="M610 120 L678 262" class="arrow"/>
<path d="M610 120 L678 400" class="arrow"/>
<path d="M920 125 L948 220" class="arrow"/>
</svg>
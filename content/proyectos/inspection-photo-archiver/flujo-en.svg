<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t"><title id="t">Photo archiver flow</title>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --box: #ffffff; --boxline: #b9c8d8; --accent: #2563eb; --accent2: #059669; --soft: #eef4fb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6edf3; --muted: #9fb0c0; --box: #18212b; --boxline: #3a4b5d; --accent: #60a5fa; --accent2: #34d399; --soft: #13202e; }
  }
  text { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
  .boxa { fill: var(--box); stroke: var(--accent); stroke-width: 2.2; }
  .boxv { fill: var(--box); stroke: var(--accent2); stroke-width: 2.2; }
  .zona { fill: var(--soft); stroke: none; }
  .arrow { stroke: var(--muted); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker></defs>
<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">Photo archiver flow</text>
<rect x="30" y="70" width="240" height="90" rx="12" class="box"/><text x="150.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Export in the inbox</text><text x="150.0" y="118" font-size="13" text-anchor="middle" class="muted">the technician drops the Excel</text><text x="150.0" y="137" font-size="13" text-anchor="middle" class="muted">in their line's folder</text>
<rect x="330" y="70" width="240" height="90" rx="12" class="box"/><text x="450.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Polling watcher</text><text x="450.0" y="118" font-size="13" text-anchor="middle" class="muted">waits until the file</text><text x="450.0" y="137" font-size="13" text-anchor="middle" class="muted">has finished syncing</text>
<rect x="630" y="70" width="240" height="90" rx="12" class="boxa"/><text x="750.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Schema detection</text><text x="750.0" y="118" font-size="13" text-anchor="middle" class="muted">by the shape of the sheets,</text><text x="750.0" y="137" font-size="13" text-anchor="middle" class="muted">not by their names</text>
<rect x="930" y="70" width="240" height="90" rx="12" class="box"/><text x="1050.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Download</text><text x="1050.0" y="118" font-size="13" text-anchor="middle" class="muted">session cookie</text><text x="1050.0" y="137" font-size="13" text-anchor="middle" class="muted">retries</text>
<rect x="630" y="210" width="240" height="90" rx="12" class="boxv"/><text x="750.0" y="236" font-size="16" font-weight="700" text-anchor="middle">Shared archive</text><text x="750.0" y="258" font-size="13" text-anchor="middle" class="muted">JPEG named and filed</text><text x="750.0" y="277" font-size="13" text-anchor="middle" class="muted">as the profile says</text>
<rect x="330" y="210" width="240" height="90" rx="12" class="boxv"/><text x="450.0" y="236" font-size="16" font-weight="700" text-anchor="middle">Cumulative ledger</text><text x="450.0" y="258" font-size="13" text-anchor="middle" class="muted">photo → source</text><text x="450.0" y="277" font-size="13" text-anchor="middle" class="muted">relative links</text>
<rect x="30" y="210" width="240" height="90" rx="12" class="box"/><text x="150.0" y="236" font-size="16" font-weight="700" text-anchor="middle">E-mail</text><text x="150.0" y="258" font-size="13" text-anchor="middle" class="muted">start · success</text><text x="150.0" y="277" font-size="13" text-anchor="middle" class="muted">partial · error</text>
<path d="M270 115 L328 115" class="arrow"/>
<path d="M570 115 L628 115" class="arrow"/>
<path d="M870 115 L928 115" class="arrow"/>
<path d="M1050 160 C1050 230 900 255 872 255" class="arrow"/>
<path d="M630 255 L572 255" class="arrow"/>
<path d="M330 255 L272 255" class="arrow"/>
<rect x="330" y="335" width="540" height="80" rx="12" class="boxa"/><text x="600.0" y="361" font-size="16" font-weight="700" text-anchor="middle">Versioned JSON profiles</text><text x="600.0" y="383" font-size="13" text-anchor="middle" class="muted">names · folder levels · ledger · alerts</text><text x="600.0" y="402" font-size="13" text-anchor="middle" class="muted">a new project = a profile, no code change</text>
<path d="M450 335 L450 302" class="dash"/>
<path d="M750 335 L750 302" class="dash"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t"><title id="t">Flujo del archivador de fotos</title>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --box: #ffffff; --boxline: #b9c8d8; --accent: #2563eb; --accent2: #059669; --soft: #eef4fb; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6edf3; --muted: #9fb0c0; --box: #18212b; --boxline: #3a4b5d; --accent: #60a5fa; --accent2: #34d399; --soft: #13202e; }
  }
  text { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
  .boxa { fill: var(--box); stroke: var(--accent); stroke-width: 2.2; }
  .boxv { fill: var(--box); stroke: var(--accent2); stroke-width: 2.2; }
  .zona { fill: var(--soft); stroke: none; }
  .arrow { stroke: var(--muted); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker></defs>
<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">Flujo del archivador de fotos</text>
<rect x="30" y="70" width="240" height="90" rx="12" class="box"/><text x="150.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Excel en la bandeja</text><text x="150.0" y="118" font-size="13" text-anchor="middle" class="muted">el técnico deja la exportación</text><text x="150.0" y="137" font-size="13" text-anchor="middle" class="muted">en la carpeta de su línea</text>
<rect x="330" y="70" width="240" height="90" rx="12" class="box"/><text x="450.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Vigilante por sondeo</text><text x="450.0" y="118" font-size="13" text-anchor="middle" class="muted">espera a que termine</text><text x="450.0" y="137" font-size="13" text-anchor="middle" class="muted">de sincronizarse</text>
<rect x="630" y="70" width="240" height="90" rx="12" class="boxa"/><text x="750.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Detección del esquema</text><text x="750.0" y="118" font-size="13" text-anchor="middle" class="muted">por la forma de las hojas,</text><text x="750.0" y="137" font-size="13" text-anchor="middle" class="muted">no por su nombre</text>
<rect x="930" y="70" width="240" height="90" rx="12" class="box"/><text x="1050.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Descarga</text><text x="1050.0" y="118" font-size="13" text-anchor="middle" class="muted">cookie de sesión</text><text x="1050.0" y="137" font-size="13" text-anchor="middle" class="muted">reintentos</text>
<rect x="630" y="210" width="240" height="90" rx="12" class="boxv"/><text x="750.0" y="236" font-size="16" font-weight="700" text-anchor="middle">Archivo compartido</text><text x="750.0" y="258" font-size="13" text-anchor="middle" class="muted">JPEG con nombre y carpeta</text><text x="750.0" y="277" font-size="13" text-anchor="middle" class="muted">decididos por el perfil</text>
<rect x="330" y="210" width="240" height="90" rx="12" class="boxv"/><text x="450.0" y="236" font-size="16" font-weight="700" text-anchor="middle">Registro acumulado</text><text x="450.0" y="258" font-size="13" text-anchor="middle" class="muted">foto → origen</text><text x="450.0" y="277" font-size="13" text-anchor="middle" class="muted">enlaces relativos</text>
<rect x="30" y="210" width="240" height="90" rx="12" class="box"/><text x="150.0" y="236" font-size="16" font-weight="700" text-anchor="middle">Correo</text><text x="150.0" y="258" font-size="13" text-anchor="middle" class="muted">inicio · éxito</text><text x="150.0" y="277" font-size="13" text-anchor="middle" class="muted">parcial · error</text>
<path d="M270 115 L328 115" class="arrow"/>
<path d="M570 115 L628 115" class="arrow"/>
<path d="M870 115 L928 115" class="arrow"/>
<path d="M1050 160 C1050 230 900 255 872 255" class="arrow"/>
<path d="M630 255 L572 255" class="arrow"/>
<path d="M330 255 L272 255" class="arrow"/>
<rect x="330" y="335" width="540" height="80" rx="12" class="boxa"/><text x="600.0" y="361" font-size="16" font-weight="700" text-anchor="middle">Perfiles JSON versionados</text><text x="600.0" y="383" font-size="13" text-anchor="middle" class="muted">nombres · niveles de carpeta · registro · avisos</text><text x="600.0" y="402" font-size="13" text-anchor="middle" class="muted">un proyecto nuevo = un perfil, sin tocar código</text>
<path d="M450 335 L450 302" class="dash"/>
<path d="M750 335 L750 302" class="dash"/>
</svg>